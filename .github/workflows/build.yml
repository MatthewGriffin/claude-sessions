# Tests every push on Linux and Windows. Only a tag like v1.2.3 builds both versions and
# publishes them as a GitHub release, which the app offers to install.
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install tmux
        run: sudo apt-get update && sudo apt-get install -y tmux
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Stamp the version
        if: startsWith(github.ref, 'refs/tags/v')
        run: python .github/stamp_version.py "${GITHUB_REF_NAME}" claude-monitor
      - name: Check it compiles
        run: python -m py_compile claude-monitor
      - uses: actions/upload-artifact@v7
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: linux
          path: claude-monitor

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install requirements
        run: python -m pip install -r requirements-windows.txt
      - name: Install build tools
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        run: python -m pip install pyinstaller
      - name: Test from source
        run: python -m unittest discover -s tests -v
      - name: Stamp the version
        if: startsWith(github.ref, 'refs/tags/v')
        run: python .github/stamp_version.py "$env:GITHUB_REF_NAME" claude-monitor
      - name: Stamp a test version
        # A run started by hand builds and tests the program without publishing it.
        if: github.event_name == 'workflow_dispatch'
        run: python .github/stamp_version.py v0.0.1 claude-monitor
      - name: Build the program
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        run: |
          Copy-Item claude-monitor build_claude_sessions.py
          python -m PyInstaller --onefile --windowed --noconfirm --name claude-sessions-windows `
            --icon assets/claude-sessions.ico --collect-all winpty --collect-all pyte build_claude_sessions.py
      - name: Test the built program's session host and update
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        timeout-minutes: 10
        env:
          CLAUDE_SESSIONS_TEST_PROGRAM: ${{ github.workspace }}\dist\claude-sessions-windows.exe
        run: python -m unittest test_app.TerminalTests test_app.BuiltUpdateTests -v
        working-directory: tests
      - uses: actions/upload-artifact@v7
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: windows
          path: dist/claude-sessions-windows.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
          path: release
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: release
        run: |
          chmod +x claude-monitor
          # The Windows download carries its version (the update button looks for that name since 0.1.21).
          versioned="claude-sessions-windows-${GITHUB_REF_NAME#v}.exe"
          mv claude-sessions-windows.exe "$versioned"
          sha256sum claude-monitor "$versioned" > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes \
            "$versioned" claude-monitor SHA256SUMS
